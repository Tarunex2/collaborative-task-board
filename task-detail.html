<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Task Details</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="task-detail-page">

        <div class="task-detail-top">

            <button
                class="back-btn"
                onclick="window.close()">

                <i class="fa-solid fa-arrow-left"></i>
                Back to Board

            </button>

        </div>



        <div class="task-detail-header">

            <h1 id="taskTitle"></h1>

            <div class="assigned-info">

                <i class="fa-solid fa-user"></i>

                <span id="taskAssigned"></span>

            </div>

        </div>


        <div class="detail-line"></div>


        <!-- Description -->

        <section class="task-detail-content">

            <h2>
                <i class="fa-regular fa-file-lines"></i>
                Description
            </h2>

            <div
                id="taskDescription"
                class="task-detail-description">
            </div>

        </section>

    </div>


    <script src="js/data.js"></script>

    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );


        const title =
            params.get("title");


        let foundTask = null;


        /* Find Task */

        Object.values(boardData).forEach(
            function (board) {

                board.lists.forEach(
                    function (list) {

                        list.tasks.forEach(
                            function (task) {

                                if (
                                    task.title === title
                                ) {

                                    foundTask = task;

                                }

                            }
                        );

                    }
                );

            }
        );


        /* Display Task */

        if (foundTask) {

            document.querySelector(
                "#taskTitle"
            ).textContent =
                foundTask.title;


            document.querySelector(
                "#taskAssigned"
            ).textContent =
                "Assigned to: " +
                (
                    foundTask.assignedTo ||
                    "Not assigned"
                );


            let description =
                foundTask.description ||
                "No description";

            description =
                description
                    .replace(
                        /^---$/gm,
                        "<hr>"
                    )
                    .replace(
                        /^## (.*)$/gm,
                        "<h3>$1</h3>"
                    )
                    .replace(
                        /\n/g,
                        "<br>"
                    );


            document.querySelector(
                "#taskDescription"
            ).innerHTML =
                description;

        }

    </script>

</body>

</html>
